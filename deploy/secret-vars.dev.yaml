# Reference map only: AWS Secrets Manager paths and JSON keys, never secret
# values. Workflows assume the OIDC role, then fetch these at runtime.
application: ai-demogaanaai-devops
environment: dev

datadog:
  enabled: true
  api_key:
    secret_id: /platform/dev/datadog
    json_key: api_key

sonarqube:
  enabled: true
  token:
    secret_id: /platform/dev/sonarqube
    json_key: token
