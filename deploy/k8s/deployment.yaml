apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-demogaanaai-devops
  namespace: ai-demogaanaai-devops-dev
  labels:
    app: ai-demogaanaai-devops
    environment: dev
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ai-demogaanaai-devops
  template:
    metadata:
      labels:
        app: ai-demogaanaai-devops
        environment: dev
    spec:
      containers:
        - name: ai-demogaanaai-devops
          # Replaced by the deploy workflow with the digest-qualified ECR image
          image: ECR_IMAGE_PLACEHOLDER
          ports:
            - containerPort: 3000
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
